# cargo-deny: falha o CI em vulnerabilidade conhecida (RustSec), crate abandonada/retirada,
# licença não permitida ou dependência vinda de fora do crates.io.
#   cargo install cargo-deny --locked && cargo deny check

[graph]
all-features = false

[advisories]
# Toda vulnerabilidade e todo aviso de crate sem manutenção/retirada (yanked) reprovam.
# Exceções, se inevitáveis, vão em `ignore` COM justificativa e prazo.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "NCSA",
]

# Crates do próprio workspace (publish = false) não precisam de licença.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
