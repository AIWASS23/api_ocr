[package]
name = "data_preparation"
version = "0.1.0"
edition = "2024"
publish = false
description = "Port em Rust do DataPreparation"

[features]
default = []
cuda = ["docling/cuda"]

[dependencies]
docling = "=2.53.1"
docling-core = "=2.53.3"
docling-pdf = "=2.53.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
