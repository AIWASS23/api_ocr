[package]
name = "embedding"
version = "0.1.0"
edition = "2024"
publish = false
description = "Estratégias de embeddings para RAG"

[features]
default = ["onnx", "vision"]
# Modelos de texto em ONNX Runtime, em processo: famílias sentence-transformers (sbert, bge, gte,
# e5, multilingual, instructor, jina, nomic), huggingface (pooling) e sparse (SPLADE). Os arquivos
# vêm de um diretório local ou do Hugging Face Hub (com espelhos ONNX).
onnx = ["dep:ort", "dep:docling-onnx", "dep:tokenizers", "dep:hf-hub", "dep:safetensors", "dep:zip"]
# Modelos de texto e imagem: clip e siglip.
vision = ["onnx", "dep:image"]
# Servidor Ollama local (HTTP).
ollama = ["dep:reqwest"]
# Contrato assíncrono (aembed, aembed_documents, aembed_query, aembed_images) sobre tokio.
async = ["dep:tokio"]
# ONNX Runtime com CUDA (device = "cuda").
cuda = ["onnx", "docling-onnx/cuda"]

[dependencies]
chunking = { path = "../chunking", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-general-category = "1.1"
unicode-normalization = "0.1"

ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"], optional = true }
# O mesmo ambiente ONNX do OCR (docling) e do chunking: um processo, um ambiente.
docling-onnx = { version = "=2.53.3", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
safetensors = { version = "0.8", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
