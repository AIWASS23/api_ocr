# API -> banco e Redis gerenciados, FORA do cluster. Restrinja aos endereços reais deles.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ocr-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-ocr
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 10.20.0.0/24 }               # TROQUE: rede do Postgres gerenciado
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - ipBlock: { cidr: 10.20.1.0/24 }               # TROQUE: rede do Redis gerenciado
      ports:
        - { protocol: TCP, port: 6379 }
