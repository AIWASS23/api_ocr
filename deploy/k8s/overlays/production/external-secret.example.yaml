# EXEMPLO (não está no kustomization): Secret `api-ocr-secrets` sincronizado de um cofre pelo
# External Secrets Operator. Qualquer mecanismo serve, desde que produza um Secret com estas chaves.
#   DATABASE_URL         postgres://usuario:senha@host:5432/api_ocr?sslmode=verify-full
#   RATE_LIMIT_REDIS_URL rediss://:senha@host:6379
#   JWT_SECRET, PASSWORD_PEPPER (>= 32 caracteres, diferentes; `api_ocr gen-secret`)
#   JWT_SECRET_PREVIOUS  (só durante a rotação)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-ocr-secrets
  namespace: api-ocr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cofre                                         # TROQUE
  target:
    name: api-ocr-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: api-ocr/producao                           # TROQUE
