# Só as rotas da API são publicadas; /docs, /openapi.json, /healthz e /readyz ficam de fora.
# O Gateway (listener HTTPS com o certificado) é definido pelo overlay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-ocr
spec:
  parentRefs:
    - name: api-ocr
      sectionName: https
  rules:
    - matches:
        - path: { type: Exact, value: /v1/data_preparation }
      backendRefs:
        - name: api-ocr
          port: 8080
      # Upload (até 120 s) + processamento (OCR_TIMEOUT_SECS) com folga.
      timeouts:
        request: 320s
    - matches:
        - path: { type: Exact, value: /v1/chunk }
      backendRefs:
        - name: api-ocr
          port: 8080
      # Envio do texto (até 30 s) + processamento (CHUNK_TIMEOUT_SECS) com folga.
      timeouts:
        request: 75s
    - matches:
        - path: { type: PathPrefix, value: /oauth/ }
        - path: { type: PathPrefix, value: /auth/ }
        - path: { type: PathPrefix, value: /v1/ }
        - path: { type: Exact, value: /.well-known/oauth-authorization-server }
      backendRefs:
        - name: api-ocr
          port: 8080
      timeouts:
        request: 35s
---
# HTTP só redireciona para HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-ocr-https-redirect
spec:
  parentRefs:
    - name: api-ocr
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
