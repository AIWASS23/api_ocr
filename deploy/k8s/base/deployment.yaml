apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ocr
  labels:
    app.kubernetes.io/name: api-ocr
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: api-ocr
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-ocr
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: api-ocr
      automountServiceAccountToken: false
      enableServiceLinks: false
      # O servidor espera até 30 s pelas requisições em andamento após o SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Réplicas em nós diferentes: um nó caindo não derruba o serviço.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-ocr
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: api-ocr
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-ocr-config
            - secretRef:
                name: api-ocr-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 6Gi
              ephemeral-storage: 4Gi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Dá tempo de o Gateway tirar o pod do balanceamento antes do SIGTERM.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
      volumes:
        # Uploads (até OCR_MAX_UPLOAD_MB por job) em memória: o documento do usuário nunca
        # encosta no disco do nó. Conta no limite de memória do contêiner.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        # Cache de grafos ONNX (~500 MB), regravado pelo warm-up a cada subida.
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
