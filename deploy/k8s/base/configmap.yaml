# Configuração NÃO secreta. Segredos (JWT_SECRET, PASSWORD_PEPPER, DATABASE_URL,
# RATE_LIMIT_REDIS_URL) vêm do Secret `api-ocr-secrets`, criado pelo overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-ocr-config
data:
  BIND_ADDR: "0.0.0.0:8080"
  # Exatamente UM proxy confiável na frente (o Envoy do Gateway): o IP do cliente é o último
  # valor de X-Forwarded-For. A NetworkPolicy garante que só o Gateway alcança a porta 8080.
  TRUST_PROXY: "true"
  ALLOW_REGISTRATION: "false"
  ENABLE_DOCS: "false"
  SANDBOX: "required"
  LOG_FORMAT: "json"
  RUST_LOG: "info,sqlx=warn"
  # Raiz somente leitura: HOME e caches vão para volumes graváveis.
  HOME: "/tmp"
  XDG_CACHE_HOME: "/cache"
  OCR_MAX_UPLOAD_MB: "25"
  OCR_MAX_PAGES: "100"
  OCR_MAX_CONCURRENT: "2"
  OCR_TIMEOUT_SECS: "180"
  # Memória: o vigia da API mata o maior worker a 85% do limits.memory do contêiner (sem isso o
  # OOM do kernel derrubaria o contêiner inteiro). Teto adicional por worker (0 = desligado):
  OCR_WORKER_MAX_RSS_MB: "0"
  OCR_WORKER_MEMORY_MB: "0"
  # Sem limite de CPU o motor enxergaria todos os núcleos do nó e criaria um worker de página
  # (~0,4 GB) para cada um: fixa o paralelismo dentro de um documento.
  DOCLING_RS_PDF_WORKERS: "4"
  OCR_MEMORY_WATERMARK_PCT: "85"
  MAX_IN_FLIGHT: "256"
  RATE_GENERAL_PER_MIN: "300"
  RATE_AUTH_PER_MIN: "20"
  RATE_OCR_PER_MIN: "10"
  # Chunking (/v1/chunk): cada pedido é um worker curto, só CPU. Texto por pedido, chunks
  # devolvidos, pedidos simultâneos no pod e prazo (o worker é morto ao estourar).
  CHUNK_MAX_TEXT_MB: "5"
  CHUNK_MAX_CHUNKS: "20000"
  CHUNK_MAX_CONCURRENT: "4"
  CHUNK_TIMEOUT_SECS: "30"
  CHUNK_WORKER_MAX_RSS_MB: "1024"
  RATE_CHUNK_PER_MIN: "60"
  # Estratégias medidas em tokens (token, semchunk, token_sentence_transformer, docling_hybrid):
  # aponte para um tokenizer.json LOCAL montado no pod (o worker não tem rede).
  # CHUNK_TOKENIZER: "/models/tokenizer"
  SECURITY_ALERT_LOGIN_FAILURES: "20"
