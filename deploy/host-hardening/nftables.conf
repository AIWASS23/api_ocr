#!/usr/sbin/nft -f
# Firewall de BORDA do host: absorve inundações de conexões antes do nginx/app.
# NÃO muda a política padrão (não corta nada do que já funciona); só descarta o abusivo.
# Usa o gancho `prerouting`, que vê a porta ORIGINAL (443/80) mesmo para tráfego que o
# Docker redireciona (DNAT) para contêineres — o `input` não vê esse tráfego.
#
# Aplicar:  sudo nft -f deploy/host-hardening/nftables.conf
# Validar:  nft -c -f deploy/host-hardening/nftables.conf
# Ajuste os limites à sua carga; clientes atrás de NAT/CGNAT dividem o mesmo IP.

table inet api_ocr_edge
delete table inet api_ocr_edge

table inet api_ocr_edge {
    set abusers_v4 { type ipv4_addr; flags dynamic,timeout; timeout 10m; }
    set abusers_v6 { type ipv6_addr; flags dynamic,timeout; timeout 10m; }

    chain edge {
        type filter hook prerouting priority -150; policy accept;

        ct state invalid drop
        # Pacotes TCP malformados / varreduras clássicas.
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 drop
        tcp flags & (syn|fin) == syn|fin drop
        tcp flags & (syn|rst) == syn|rst drop

        # IPs que já estouraram o limite ficam bloqueados por 10 min.
        ip  saddr @abusers_v4 drop
        ip6 saddr @abusers_v6 drop

        # Novas conexões por IP: >30/s (rajada 60) => bloqueia o IP.
        tcp dport { 80, 443 } ct state new ip  saddr != 127.0.0.0/8 meter new_v4 { ip  saddr limit rate over 30/second burst 60 packets } add @abusers_v4 { ip  saddr } drop
        tcp dport { 80, 443 } ct state new ip6 saddr != ::1          meter new_v6 { ip6 saddr limit rate over 30/second burst 60 packets } add @abusers_v6 { ip6 saddr } drop

        # Conexões simultâneas por IP: >100 => descarta as novas.
        tcp dport { 80, 443 } ct state new meter conc_v4 size 65535 { ip  saddr ct count over 100 } drop
        tcp dport { 80, 443 } ct state new meter conc_v6 size 65535 { ip6 saddr ct count over 100 } drop

        # SSH: tentativas novas limitadas (força bruta).
        tcp dport 22 ct state new meter ssh_v4 { ip saddr limit rate over 6/minute burst 6 packets } drop
    }
}
