[workspace]
members = [".", "api"]
resolver = "3"

[package]
name = "data_preparation"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cuda = ["docling/cuda"]

[dependencies]
docling = "=2.15.0"
docling-core = "=2.15.0"
docling-pdf = "=2.15.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
