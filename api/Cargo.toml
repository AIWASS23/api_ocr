[package]
name = "api_ocr"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cuda = ["data_preparation/cuda"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
chunking = { path = "../src/chunking", features = ["docling"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
data_preparation = { path = "../src/data_preparation" }
governor = "0.10.4"
hex = "0.4.3"
hmac = "0.13"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service", "server-graceful"] }
imagesize = "0.15.0"
infer = "0.22.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
landlock = "0.4.7"
libc = "0.2.190"
rand = "0.10.3"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "script", "tokio-rustls-comp"] }
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "macros"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7.1", features = ["limit", "timeout", "trace", "set-header", "request-id", "cors", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
h2 = "0.4.20"
http = "1.5.0"
reqwest = { version = "0.13.5", features = ["form", "json", "multipart", "query"] }
url = "2.5.8"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
